name: Publish NuGet

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      # A tag can be pushed with a failing build (GitHub's branch protection does
      # not cover tags), so gate publishing on the tagged commit's CI checks.
      - name: Fail if CI checks did not pass on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checks=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '.check_runs')
          echo "$checks" | jq -e 'length > 0' > /dev/null || { echo "No CI check runs found for ${{ github.sha }}"; exit 1; }
          echo "$checks" | jq -e 'all(.[]; .status == "completed" and .conclusion == "success")' > /dev/null \
            || { echo "CI checks not all green for ${{ github.sha }}:"; echo "$checks" | jq -r '.[] | "\(.name): \(.status)/\(.conclusion)"'; exit 1; }
          echo "All CI checks passed for ${{ github.sha }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # dotnet build triggers GeneratePackageOnBuild in Release, which packs
      # only after every TFM is built (dotnet pack alone hits NU5026 because
      # the pack target runs before some TFM outputs exist).
      - name: Build + pack JsonSubTypes (Newtonsoft)
        run: dotnet build JsonSubTypes/JsonSubTypes.csproj -c Release

      - name: Build + pack JsonSubTypes.Text.Json
        run: dotnet build JsonSubTypes.Text.Json/JsonSubTypes.Text.Json.csproj -c Release

      - name: Build + pack JsonSubTypes.Aot
        run: dotnet build JsonSubTypes.Aot/JsonSubTypes.Aot.csproj -c Release

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet API key (no long-lived secret). Requires a trusted publishing
      # policy on nuget.org for owner manuc66, repository JsonSubTypes and
      # workflow .github/workflows/publish.yml.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget-login
        with:
          user: manuc66

      # Each tag pushes every package, but a package whose version is already on
      # nuget.org must not be re-pushed: --skip-duplicate only skips the nupkg
      # and would still upload a freshly built snupkg, whose PDBs never match the
      # DLLs already published (different commit / toolchain), failing validation.
      - name: Publish JsonSubTypes
        run: |
          id=jsonSubTypes
          version=$(dotnet msbuild JsonSubTypes/JsonSubTypes.csproj -getProperty:Version -p:Configuration=Release | tail -n 1)
          if curl -sf -o /dev/null "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg"; then
            echo "JsonSubTypes $version already on nuget.org, skipping"
          else
            dotnet nuget push "JsonSubTypes/bin/Release/*.nupkg" "JsonSubTypes/bin/Release/*.snupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi

      - name: Publish JsonSubTypes.Text.Json
        run: |
          id=jsonSubTypes.text.json
          version=$(dotnet msbuild JsonSubTypes.Text.Json/JsonSubTypes.Text.Json.csproj -getProperty:Version -p:Configuration=Release | tail -n 1)
          if curl -sf -o /dev/null "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg"; then
            echo "JsonSubTypes.Text.Json $version already on nuget.org, skipping"
          else
            dotnet nuget push "JsonSubTypes.Text.Json/bin/Release/*.nupkg" "JsonSubTypes.Text.Json/bin/Release/*.snupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi

      - name: Publish JsonSubTypes.Aot
        run: |
          id=jsonSubTypes.aot
          version=$(dotnet msbuild JsonSubTypes.Aot/JsonSubTypes.Aot.csproj -getProperty:Version -p:Configuration=Release | tail -n 1)
          if curl -sf -o /dev/null "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg"; then
            echo "JsonSubTypes.Aot $version already on nuget.org, skipping"
          else
            dotnet nuget push "JsonSubTypes.Aot/bin/Release/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi
